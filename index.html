    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warm: {
                            50: '#fcfbfa',

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .sheet-font { font-family: 'Sarabun', sans-serif; }
        
        /* สไตล์ตารางและฟอร์มกระดาษ A4 */
        :root {
            --ink: #1a1a1a;
            --line: #000;
            --paper: #fff;
            --head-bg: #d9d9d9;
            --sub-bg: #f2f2f2;
        }
        .sheet table { width: 100%; border-collapse: collapse; margin-bottom: -1px; }
        .sheet td, .sheet th { border: 1px solid var(--line); padding: 5px 7px; vertical-align: middle; }
        .section-head td { background: var(--head-bg); font-weight: 700; font-size: 13.5px; }
        .item-table th { background: var(--sub-bg); font-weight: 600; text-align: center; }
        .item-table td.num { width: 34px; text-align: center; }
        .item-table td.chk { width: 52px; text-align: center; }
        .chkbox { width: 15px; height: 15px; accent-color: #000; cursor: pointer; }
        .fill input[type="text"], .fill input[type="time"] { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 13px; padding: 2px; color: var(--ink); }
        .fill input[type="text"]:focus, .fill input[type="time"]:focus { outline: 1px dashed #999; }
        .radio-inline { display: inline-flex; align-items: center; gap: 6px; margin-right: 22px; cursor: pointer; }
        .radio-inline input { width: 15px; height: 15px; accent-color: #000; }
        .signblock td { height: 34px; }

        @media print {
            body { background: #fff !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .sheet { box-shadow: none !important; margin: 0 !important; width: auto !important; min-height: auto !important; padding: 0 !important; }
        }
    </style>
</head>

        function renderFormMenuList() {
            const listContainer = document.getElementById('formMenuList');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            formsData.forEach(form => {
                const isActive = form.code === currentFormCode;
                const btn = document.createElement('button');
                btn.type = "button";
                btn.onclick = () => {
                    currentFormCode = form.code;
                    renderFormMenuList();
                    loadSheetForm(currentFormCode);
                };
                btn.className = `w-full text-left px-3.5 py-2.5 rounded-xl text-xs transition flex flex-col space-y-0.5 ${isActive ? 'bg-amber-100 text-amber-900 font-bold border border-amber-300' : 'text-warm-900 hover:bg-warm-100 bg-white border border-warm-200'}`;
                btn.innerHTML = `
                    <span class="text-[10px] text-amber-700 font-bold">${form.code}</span>
                    <span class="truncate">${form.name}</span>
                `;
                listContainer.appendChild(btn);
            });
        }

                        <td class="fill"><input type="text" id="s_mea2" value="${saved.mea2 || ''}"></td>
                        <td class="label">MEA No3.</td>
                        <td class="fill"><input type="text" id="s_mea3" value="${saved.mea3 || ''}"></td>

                        <th rowspan="2">รายการ</th>

                        <th rowspan="2">ข้อบกพร่อง</th>
                    </tr>
                    <tr>
                        <th style="width:52px;">ปกติ</th>

                        <th style="width:52px;">ไม่มี</th>
                    </tr>
            `;

            formInfo.items.forEach((item, idx) => {
                let itemSaved = (saved.items && saved.items[idx]) || { status: 'ปกติ', defect: '' };
                html += `
                    <tr>
                        <td class="num">2.${idx+1}</td>
                        <td class="itemname">${item}</td>
                        <td class="chk"><input type="checkbox" class="chkbox" name="chk_${idx}" value="ปกติ" ${itemSaved.status === 'ปกติ' ? 'checked' : ''}></td>
                        <td class="chk"><input type="checkbox" class="chkbox" name="chk_${idx}" value="ชำรุด" ${itemSaved.status === 'ชำรุด' ? 'checked' : ''}></td>
                        <td class="chk"><input type="checkbox" class="chkbox" name="chk_${idx}" value="ไม่มี" ${itemSaved.status === 'ไม่มี' ? 'checked' : ''}></td>
                        <td class="remark"><input type="text" id="def_${idx}" value="${itemSaved.defect || ''}"></td>
                    </tr>
                `;
            });

            html += `
                </table>

                <!-- Section 3: ตรวจสอบวัดกระแสและแรงดันไฟฟ้า -->
                <table>
                    <tr class="section-head"><td colspan="6">3&nbsp;&nbsp;ตรวจสอบวัดกระแสและแรงดันไฟฟ้า</td></tr>
                    <tr>
                        <td colspan="2">
                            <label class="radio-inline"><input type="checkbox" id="s_day" ${saved.timing === 'กลางวัน' ? 'checked' : ''}>กลางวัน</label>
                            <label class="radio-inline"><input type="checkbox" id="s_night" ${saved.timing === 'กลางคืน' ? 'checked' : ''}>กลางคืน</label>
                        </td>
                        <td class="label" style="width:60px;">เวลา :</td>
                        <td class="fill"><input type="time" id="s_time" value="${saved.time || ''}"></td>
                        <td colspan="2">
                            <label class="radio-inline">วิธีการ:</label>
                            <label class="radio-inline"><input type="checkbox" id="m_onsite" ${saved.method === 'วัดหน้างาน' ? 'checked' : ''}>วัดหน้างาน</label>
                            <label class="radio-inline"><input type="checkbox" id="m_tlm" ${saved.method === 'TLM' ? 'checked' : ''}>TLM</label>
                        </td>
                    </tr>
                </table>

                <!-- Section 4 & 5 -->
                <table>
                    <tr class="section-head"><td>4&nbsp;&nbsp;สิ่งที่ต้องปรับปรุงหรือข้อมูลเพิ่มเติม :</td></tr>
                    <tr><td style="height:26px;" class="fill"><input type="text" id="s_improve" value="${saved.improvements || ''}"></td></tr>
                </table>
                <table>
                    <tr class="section-head"><td>5&nbsp;&nbsp;การปรับปรุงข้อบกพร่อง :</td></tr>
                    <tr><td style="height:26px;" class="fill"><input type="text" id="s_repair" value="${saved.repairs || ''}"></td></tr>
                </table>

                <!-- Signatures -->
                <table>
                    <tr class="signblock">
                        <td class="label" style="width:90px;">ผู้ตรวจ</td>
                        <td class="fill"><input type="text" id="sig_inspector" value="${saved.inspector || ''}"></td>
                        <td class="label" style="width:90px;">ผู้ตรวจสอบ</td>
                        <td class="fill"><input type="text" id="sig_verifier" value="${saved.verifier || ''}"></td>
                    </tr>
                    <tr class="signblock">
                        <td class="label">ตำแหน่ง</td>
                        <td class="fill"><input type="text" id="sig_inspectorPos" value="${saved.inspectorPos || ''}"></td>
                        <td class="label">ตำแหน่ง</td>
                        <td class="fill"><input type="text" id="sig_verifierPos" value="${saved.verifierPos || ''}"></td>
                    </tr>
                    <tr class="signblock">
                        <td class="label">วันที่</td>
                        <td class="fill"><input type="text" id="sig_inspectorDate" value="${saved.inspectorDate || ''}"></td>
                        <td class="label">วันที่</td>
                        <td class="fill"><input type="text" id="sig_verifierDate" value="${saved.verifierDate || ''}"></td>
                    </tr>
                </table>
            `;

            container.innerHTML = html;
        }

        function saveCurrentSheetData() {
            const formInfo = formsData.find(f => f.code === currentFormCode);
            let itemsArr = [];
            formInfo.items.forEach((item, idx) => {
                const chkChecked = document.querySelector(`input[name="chk_${idx}"]:checked`);
                const defect = document.getElementById(`def_${idx}`)?.value || '';
                itemsArr.push({ status: chkChecked ? chkChecked.value : 'ปกติ', defect });
            });

            storedSheetData[currentFormCode] = {
                stationId: document.getElementById('s_stationId')?.value || '',
                location: document.getElementById('s_location')?.value || '',
                lat: document.getElementById('s_lat')?.value || '',
                long: document.getElementById('s_long')?.value || '',
                mea1: document.getElementById('s_mea1')?.value || '',
                mea2: document.getElementById('s_mea2')?.value || '',
                mea3: document.getElementById('s_mea3')?.value || '',
                phases: document.getElementById('s_phases')?.value || '',
                timing: document.getElementById('s_day')?.checked ? 'กลางวัน' : (document.getElementById('s_night')?.checked ? 'กลางคืน' : ''),
                time: document.getElementById('s_time')?.value || '',
                method: document.getElementById('m_onsite')?.checked ? 'วัดหน้างาน' : (document.getElementById('m_tlm')?.checked ? 'TLM' : ''),
                improvements: document.getElementById('s_improve')?.value || '',
                repairs: document.getElementById('s_repair')?.value || '',
                inspector: document.getElementById('sig_inspector')?.value || '',
                inspectorPos: document.getElementById('sig_inspectorPos')?.value || '',
                inspectorDate: document.getElementById('sig_inspectorDate')?.value || '',
                verifier: document.getElementById('sig_verifier')?.value || '',
                verifierPos: document.getElementById('sig_verifierPos')?.value || '',
                verifierDate: document.getElementById('sig_verifierDate')?.value || '',
                items: itemsArr
            };

            localStorage.setItem('mea_sheet_records', JSON.stringify(storedSheetData));
            showToast("บันทึกข้อมูลฟอร์มกระดาษเรียบร้อยแล้ว");
        }

        function handleGoogleLogin() {
            currentUser = { name: "ศิรภัสสร กลับสุข" };
            localStorage.setItem('mea_user', JSON.stringify(currentUser));
            checkUserAuth();
            showToast("เข้าสู่ระบบสำเร็จ");
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('mea_user');
            checkUserAuth();
            showToast("ออกจากระบบแล้ว");
        }

        function checkUserAuth() {
            const loginBtn = document.getElementById('googleLoginBtn');
            const userProfile = document.getElementById('userProfile');
            if (currentUser) {
                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userProfile.classList.add('flex');
                document.getElementById('userName').innerText = currentUser.name;
            } else {
                loginBtn.classList.remove('hidden');
                userProfile.classList.add('hidden');
                userProfile.classList.remove('flex');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
