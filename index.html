<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบำรุงรักษาอุปกรณ์ไฟฟ้า - แบบฟอร์มตรวจสอบครบถ้วน 11 ใบงาน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; color: #1e293b; margin: 0; padding: 0; }
        .app-container { width: 210mm; max-width: 100%; margin: 0 auto; box-sizing: border-box; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(30, 41, 59, 0.08), 0 5px 10px -5px rgba(30, 41, 59, 0.05);
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            margin: 0 auto;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #000000; padding: 3px 5px; font-size: 10px; color: #000000; }
        th { background-color: #f1f5f9; font-weight: 600; text-align: center; }
        input[type="text"], input[type="date"], select { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 10px; color: #000000; }
        textarea { color: #000000; }
        .form-header-bg { background-color: #d1d5db; font-weight: bold; color: #000; }
        .sub-header-bg { background-color: #f3f4f6; font-weight: bold; color: #000; }

        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; border-radius: 0 !important; border: none !important; }
            input[type="text"], input[type="date"], select { border: none !important; }
        }

</head>
<body class="bg-slate-100 min-h-screen">

    <div class="flex flex-col lg:flex-row min-h-screen">

            <div class="flex items-center gap-3 pb-3 border-b border-slate-200">

            <!-- Tab Navigation -->

                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="saveNewRecord()" class="px-2.5 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg font-medium transition cursor-pointer text-xs shadow-xs">💾 บันทึกใหม่</button>
                    <button onclick="saveCurrentRecord()" class="px-2.5 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg font-medium transition cursor-pointer text-xs">📝 บันทึกทับ</button>
                    <button onclick="copyNewDraft()" class="px-2.5 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg font-medium transition cursor-pointer text-xs">📄 คัดลอก</button>
                    <button onclick="createNewForm()" class="px-2.5 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg font-medium transition cursor-pointer text-xs">➕ ฟอร์มใหม่</button>
                    <button onclick="clearFormInputs()" class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg font-medium transition cursor-pointer text-xs col-span-2">🗑️ ล้างข้อมูล</button>
                </div>
                <!-- Admin Only Feature -->
                <div id="adminToolsContainer" class="hidden pt-2 border-t border-slate-200 space-y-1.5">
                    <div class="text-[10px] font-bold text-rose-600">🛡️ เมนูเฉพาะ Admin</div>
                    <button onclick="adminManageAllRecords()" class="w-full px-2 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded text-xs font-medium cursor-pointer">⚙️ จัดการ/อนุมัติข้อมูลทั้งหมด</button>

                <button onclick="window.print()" class="w-full px-3 py-2 bg-slate-800 text-white rounded-lg font-medium transition cursor-pointer shadow-xs text-xs mt-1">🖨️ พิมพ์เอกสาร / PDF</button>

            </div>

            <!-- Saved Records Section -->

                    <div class="form-header-bg p-1 my-1">อุณหภูมิเปรียบเทียบ Delta T (°C) และลำดับความสำคัญ[cite: 12]</div>
                    <table>
                        <tr class="sub-header-bg text-center"><td>Delta T 0-10°C (ปกติ: P4)[cite: 12]</td><td>Delta T >10-20°C (P3)[cite: 12]</td><td>Delta T >20-40°C (P2)[cite: 12]</td><td>Delta T >40°C (ด่วนมาก: P1)[cite: 12]</td></tr>
                        <tr><td class="text-center"><input type="checkbox" class="accent-radio"></td><td class="text-center"><input type="checkbox" class="accent-radio"></td><td class="text-center"><input type="checkbox" class="accent-radio"></td><td class="text-center"><input type="checkbox" class="accent-radio"></td></tr>
                    </table>
                    <div class="flex justify-between text-[9px] mt-2 pt-1 border-t border-black text-black"><span>ปรับปรุงครั้งที่ 0[cite: 12]</span><span class="font-mono">SF-07-0-024[cite: 12]</span></div>
                `
            },
            "025": {
                title: "รายงานผลการตรวจสอบการคายประจุไฟฟ้า (Partial Discharge)",
                code: "SF-07-0-025",
                render: () => `
                    <div class="text-center font-bold text-sm mb-2 text-black">รายงานผลการตรวจสอบการคายประจุไฟฟ้าบางส่วน (Partial Discharge) โดย Acoustic Camera</div>
                    <table>
                        <tr><td class="sub-header-bg w-20">Station ID</td><td><input type="text"></td><td class="sub-header-bg w-20">อุปกรณ์</td><td><input type="text"></td><td class="sub-header-bg w-20">MEA No.</td><td><input type="text"></td></tr>
                        <tr><td class="sub-header-bg">สถานที่</td><td colspan="5"><input type="text"></td></tr>
                        <tr><td colspan="6">ระดับความเข้มเสียงที่วัดได้: <input type="text" class="border-b border-black w-24 inline-block"> dB</td></tr>
                        <tr><td colspan="6">ระดับความรุนแรง: <label><input type="checkbox" class="accent-radio"> สูงมาก</label> &nbsp; <label><input type="checkbox" class="accent-radio"> สูง</label> &nbsp; <label><input type="checkbox" class="accent-radio"> ปานกลาง</label> &nbsp; <label><input type="checkbox" class="accent-radio"> ต่ำ</label></td></tr>
                    </table>
                    <div class="flex justify-between text-[9px] mt-2 pt-1 border-t border-black text-black"><span>ปรับปรุงครั้งที่ 0</span><span class="font-mono">SF-07-0-025</span></div>
                `
            }
        };

        const pillsContainer = document.getElementById('pillsContainer');
        const a4Paper = document.getElementById('a4Paper');

        function loadForm(key) {
            currentFormKey = key;
            const form = formsData[key] || formsData["015"];
            a4Paper.innerHTML = form.render();

            document.querySelectorAll('.form-pill').forEach(btn => {
                if(btn.dataset.key === key) {
                    btn.className = "form-pill w-full text-left px-3 py-2 bg-sky-600 text-white rounded-md font-semibold text-xs shadow-xs cursor-pointer transition-all";
                } else {
                    btn.className = "form-pill w-full text-left px-3 py-2 bg-white border border-slate-300 text-slate-700 rounded-md font-medium text-xs hover:bg-sky-50 cursor-pointer transition-all";
                }
            });
        }

        Object.keys(formsData).forEach(key => {
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.className = "form-pill";
            btn.innerText = formsData[key].code + " - " + formsData[key].title;
            btn.onclick = () => loadForm(key);
            pillsContainer.appendChild(btn);
        });

        function getGPSLocation(latId, longId) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        document.getElementById(latId).value = lat;
                        document.getElementById(longId).value = lon;
                        alert("📍 ดึงพิกัด GPS สำเร็จ: " + lat + ", " + lon);
                    },
                    (error) => { alert("⚠️ ไม่สามารถดึงพิกัดได้"); }
                );
            } else { alert("❌ เบราว์เซอร์ไม่รองรับ GPS"); }
        }

        function handleLogin() {
            const roleInput = prompt("กรุณาเลือกสิทธิ์เข้าใช้งาน:\nพิมพ์ 'admin' สำหรับผู้ดูแลระบบ\nพิมพ์ 'user' สำหรับผู้ใช้งานทั่วไป", "user");
            if (!roleInput) return;
            
            const cleanRole = roleInput.trim().toLowerCase();
            if (cleanRole === 'admin' || cleanRole === 'user') {
                currentRole = cleanRole;
                currentUser = cleanRole === 'admin' ? 'System Administrator' : 'Field Inspector (User)';
                
                document.getElementById('userAuthContainer').innerHTML = `
                    <div class="flex items-center justify-between px-3 py-2 border rounded-md text-xs font-medium ${currentRole === 'admin' ? 'border-rose-200 bg-rose-50 text-rose-800' : 'border-emerald-200 bg-emerald-50 text-emerald-800'}">
                        <span>👤 ${currentUser} (${currentRole.toUpperCase()})</span>
                        <button onclick="handleLogout()" class="text-[10px] text-slate-600 hover:underline cursor-pointer">ออก</button>
                    </div>
                `;
                document.getElementById('loginStatusBanner').innerHTML = `<span class="font-medium">✅ เข้าสู่ระบบสำเร็จในฐานะ <b>${currentRole.toUpperCase()}</b></span>`;
                document.getElementById('loginStatusBanner').className = "bg-emerald-50 border border-emerald-200 text-emerald-800 px-3 py-2 rounded-lg text-[11px]";
                
                if (currentRole === 'admin') {
                    document.getElementById('adminToolsContainer').classList.remove('hidden');
                } else {
                    document.getElementById('adminToolsContainer').classList.add('hidden');
                }
                
                document.getElementById('savedRecordsList').innerHTML = "รายการบันทึกพร้อมใช้งาน";
                document.getElementById('savedCount').innerText = "1";
            } else {
                alert("⚠️ กรุณากรอกคำว่า admin หรือ user ให้ถูกต้อง");
            }
        }

        function handleLogout() {
            currentUser = null;
            currentRole = null;
            document.getElementById('userAuthContainer').innerHTML = `
                <button onclick="handleLogin()" class="w-full flex items-center justify-center gap-2 px-3 py-2 border border-sky-200 rounded-md text-xs font-medium hover:bg-sky-50 transition bg-white text-sky-700 cursor-pointer shadow-2xs">
                    🔑 เข้าสู่ระบบ (Admin / User)
                </button>
            `;
            document.getElementById('loginStatusBanner').innerHTML = `<span>⚠️ ยังไม่ได้เข้าสู่ระบบ</span>`;
            document.getElementById('loginStatusBanner').className = "bg-amber-50 border border-amber-200 text-amber-800 px-3 py-2 rounded-lg text-[11px]";
            document.getElementById('adminToolsContainer').classList.add('hidden');
            document.getElementById('savedRecordsList').innerHTML = "เข้าสู่ระบบเพื่อดูรายการ";
            document.getElementById('savedCount').innerText = "0";
        }

        function saveNewRecord() { 
            if (!currentUser) { alert("⚠️ กรุณาเข้าสู่ระบบก่อน"); return; }
            alert(`💾 บันทึกฟอร์มใหม่สำเร็จ (${currentRole.toUpperCase()})`); 
        }
        function saveCurrentRecord() { 
            if (!currentUser) { alert("⚠️ กรุณาเข้าสู่ระบบก่อน"); return; }
            alert("📝 บันทึกทับข้อมูลปัจจุบันสำเร็จ"); 
        }
        function copyNewDraft() { alert("📄 คัดลอกร่างใหม่สำเร็จ"); }
        function createNewForm() { loadForm(currentFormKey); alert("➕ สร้างฟอร์มใหม่เรียบร้อย"); }
        function clearFormInputs() { loadForm(currentFormKey); alert("🗑️ ล้างข้อมูลในฟอร์มเรียบร้อย"); }
        function refreshSavedRecords() { 
            if (!currentUser) { alert("⚠️ กรุณาเข้าสู่ระบบก่อน"); return; }
            alert("🔄 รีเฟรชรายการเรียบร้อย"); 
        }
        function adminManageAllRecords() {
            if (currentRole !== 'admin') { alert("❌ เฉพาะ Admin เท่านั้น"); return; }
            alert("🛡️ เปิดหน้าจัดการและอนุมัติข้อมูลทั้งหมดสำหรับ Admin");
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files.length) return;
            const gallery = document.getElementById('imageGallery');
            document.getElementById('noImageText')?.remove();

            for (let i = 0; i < files.length; i++) {
                uploadedImages.push(files[i]);
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = "relative group border border-slate-200 rounded-md overflow-hidden aspect-square bg-slate-100 flex items-center justify-center";
                    div.innerHTML = `<img src="${e.target.result}" class="object-cover w-full h-full">`;
                    gallery.appendChild(div);
                }
                reader.readAsDataURL(files[i]);
            }
        }

        loadForm("015");
    </script>
</body>
